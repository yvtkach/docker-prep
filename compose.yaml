services:
  backend:
    build: ./backend
#   ports:
#    - "8000:8000"
    networks:
      - frontnet
      - backnet
    secrets:
      - db-password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    networks:
      - backnet
    environment:
      - MARIADB_DATABASE=example
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/db-password
    volumes:
      - db-data:/var/lib/mysql
    secrets:
      - db-password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  proxy:
    build: ./proxy
    ports:
      - "80:80"
    networks:
      - frontnet

secrets:
  db-password:
    file: ./db/password.txt
    
networks:
  frontnet:
  backnet:

volumes:
  db-data: